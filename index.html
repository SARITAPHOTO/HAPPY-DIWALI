<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12051f">
<meta name="description" content="आपको और आपके परिवार को दीपावली की हार्दिक शुभकामनाएँ — Happy Diwali!">
<title>Happy Diwali ✨ | शुभ दीपावली</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#ffd878;--gold2:#ffad32;--cream:#fff4d4}
body{min-height:100vh;overflow:hidden;color:var(--cream);font-family:Georgia,'Noto Serif Devanagari',serif;background:radial-gradient(ellipse at 50% 80%,#4d1455 0%,#210b35 40%,#080615 100%);display:flex;align-items:center;justify-content:center;text-align:center}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.scene{position:relative;z-index:2;width:min(92%,900px);padding:35px 20px 100px}
.eyebrow{letter-spacing:5px;text-transform:uppercase;font:600 12px Arial,sans-serif;color:#f4c96b;opacity:.9;margin-bottom:18px}
h1{font-family:Georgia,serif;font-size:clamp(48px,10vw,112px);line-height:.98;letter-spacing:2px;color:#ffe8a2;text-shadow:0 0 12px #ffb52b,0 0 35px #f78a25,0 5px 25px #000;animation:glow 3s ease-in-out infinite alternate}
h1 span{display:block;font-size:.42em;letter-spacing:7px;margin-top:18px;color:#fff2ce}
.rule{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:30px auto}
.greeting{font-size:clamp(18px,3vw,28px);line-height:1.8;color:#fff2dc;max-width:720px;margin:auto;text-shadow:0 2px 10px #000}
.signature{margin-top:20px;font:italic 16px Arial,sans-serif;color:#f7c86d;letter-spacing:1px}
.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:30px}
button{border:1px solid #ffdc91;background:linear-gradient(135deg,#ffdf8d,#f6a42c);color:#35133a;border-radius:999px;padding:13px 23px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 0 20px #ffb12a44;transition:.25s}
button:hover{transform:translateY(-3px);box-shadow:0 0 30px #ffb12a88}
button.secondary{background:#ffffff0d;color:#ffe7a8;border-color:#e6bd6c}
button.whatsapp{background:linear-gradient(135deg,#39df85,#12a85a);color:#052b17;border-color:#8affbc;box-shadow:0 0 22px #25d36655}
.reply-note{font:12px Arial,sans-serif;color:#e9d8ff;margin-top:12px;opacity:.85}
.diya{position:fixed;bottom:18px;font-size:40px;filter:drop-shadow(0 0 15px #ff9e22);animation:flicker 1.5s infinite alternate}
.d1{left:8%}.d2{left:24%;font-size:30px;animation-delay:.3s}.d3{right:24%;font-size:30px;animation-delay:.6s}.d4{right:8%}
@keyframes glow{from{text-shadow:0 0 10px #ffb52b,0 0 25px #f78a25,0 5px 25px #000}to{text-shadow:0 0 18px #fff0a8,0 0 55px #ff8a19,0 0 90px #e92e85}}
@keyframes flicker{from{transform:scale(.96);opacity:.8}to{transform:scale(1.06);opacity:1}}
@media(max-width:520px){.scene{padding-bottom:90px}.eyebrow{letter-spacing:3px}.greeting{line-height:1.65}.diya{font-size:28px}.d2,.d3{font-size:22px}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main class="scene">
<div class="eyebrow">A festival of lights • Love • Peace • Prosperity</div>
<h1>HAPPY<br>DIWALI<span>शुभ दीपावली</span></h1>
<div class="rule"></div>
<p class="greeting">दीपों की रोशनी आपके जीवन में सुख, शांति, समृद्धि और खुशियाँ लेकर आए।<br>आपको और आपके पूरे परिवार को दीपावली की हार्दिक शुभकामनाएँ!</p>
<div class="signature">May your life shine brighter than ever ✨</div>
<div class="buttons">
<button id="fireworks">🎆 आतिशबाज़ी चलाएँ</button>
<button class="secondary" id="share">💌 शुभकामनाएँ शेयर करें</button>
<button class="whatsapp" id="reply">💬 हमें WhatsApp पर जवाब दें</button>
</div>
</main>
<div class="diya d1">🪔</div><div class="diya d2">🪔</div><div class="diya d3">🪔</div><div class="diya d4">🪔</div>
<script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');let w,h,particles=[];
function resize(){w=canvas.width=innerWidth*devicePixelRatio;h=canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
function burst(x=Math.random()*innerWidth,y=Math.random()*innerHeight*.55){const colors=['#ffd76a','#ff8c42','#ff4d9d','#a78bfa','#ffffff','#7cf7ff'];for(let i=0;i<75;i++){let a=Math.random()*Math.PI*2,s=Math.random()*4+1;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:Math.random()*60+35,color:colors[Math.floor(Math.random()*colors.length)],r:Math.random()*2.5+1})}}
function animate(){ctx.clearRect(0,0,innerWidth,innerHeight);particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.025;p.vx*=.99;p.life--;ctx.globalAlpha=Math.max(0,p.life/75);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(animate)}
animate();setInterval(()=>burst(),1500);setTimeout(()=>burst(innerWidth*.5,innerHeight*.25),500);
document.getElementById('fireworks').addEventListener('click',()=>{for(let i=0;i<5;i++)setTimeout(()=>burst(Math.random()*innerWidth,Math.random()*innerHeight*.55),i*180)});
document.getElementById('reply').addEventListener('click',()=>{const msg='नमस्ते! मैंने आपकी Happy Diwali वेबसाइट देखी। मेरी तरफ से दीपावली की शुभकामनाएँ!';window.open('https://wa.me/919314711514?text='+encodeURIComponent(msg),'_blank','noopener');});
document.getElementById('share').addEventListener('click',async()=>{const text='🪔 आपको और आपके परिवार को दीपावली की हार्दिक शुभकामनाएँ! आपका जीवन सुख, शांति और समृद्धि से जगमगाता रहे। ✨';if(navigator.share){try{await navigator.share({title:'Happy Diwali',text,url:location.href})}catch(e){}}else{try{await navigator.clipboard.writeText(text+' '+location.href);alert('शुभकामनाएँ कॉपी हो गईं! अब शेयर करें।')}catch(e){prompt('शुभकामनाएँ कॉपी करें:',text+' '+location.href)}}});
</script>
</body>
</html>
